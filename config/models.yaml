# Candidate models per family. Name patterns, not final ids:
# `make providers` lists what each provider actually offers, probes matches, and writes
# config/resolved_models.json. Never use an id that was not probed successfully.
families:
  llama:     {databricks: ["llama-4-maverick", "llama-3-3-70b"], openrouter: ["meta-llama/llama-4", "meta-llama/llama-3.3-70b"]}
  qwen:      {databricks: ["qwen3"], openrouter: ["qwen/qwen3"]}
  gpt-oss:   {databricks: ["gpt-oss-120b"], openrouter: ["openai/gpt-oss-120b"]}
  gemma:     {databricks: ["gemma-3-12b"], openrouter: ["google/gemma-3"]}
  anthropic: {databricks: ["claude"], openrouter: ["anthropic/claude"], anthropic: ["claude"]}
  small:     {databricks: ["llama-3-1-8b", "gemma-3-12b", "gpt-oss-20b"], openrouter: ["meta-llama/llama-3.1-8b"]}
embeddings:
  databricks: ["gte-large", "bge-large", "qwen3-embedding"]
  local: "BAAI/bge-small-en-v1.5"
roles:
  # strong = prefer the largest available model; families for defenders/referee must differ
  extractor: strong
  formalizer: strong
  reranker: strong
  defender_a: strong
  defender_b: strong_other_family
  referee: third_family
  generators: rotate_all_families
  naive_questioner: small
